<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="vector-er logo: the glyph ER with a macron above, indicating a vector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="8" y="8" width="384" height="384" rx="72" fill="url(#bg)"/>

  <!-- macron (overline) above the glyph: the vector indicator -->
  <rect x="76" y="84" width="248" height="18" rx="9" fill="#ffffff"
        opacity="0.94" aria-label="macron/overline"/>

  <!-- glyph "ER" rendered as strokes -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round"
     stroke-width="34">
    <!-- E: vertical + three bars -->
    <path d="M 104 150 V 310"/>
    <path d="M 104 150 H 184"/>
    <path d="M 104 230 H 168"/>
    <path d="M 104 310 H 184"/>
    <!-- R: bowl + leg -->
    <path d="M 244 310 V 150 H 300 Q 346 150 346 198 Q 346 244 300 244 H 244"/>
    <path d="M 258 244 L 300 310"/>
  </g>
</svg>