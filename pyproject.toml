[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorer"
description = "Framework for embedding-and-vector-based entity resolution: incremental (parse -> embed -> vector-block -> Fellegi-Sunter -> classify) and batch (canopy-block -> Fellegi-Sunter -> Swoosh) pipelines with an extensible comparison set spanning the standard attribute-comparison families of record linkage -- implemented natively in NumPy with no SQL engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "vector-er contributors" },
]
keywords = [
    "entity-resolution",
    "record-linkage",
    "fellegi-sunter",
    "swoosh",
    "deduplication",
    "embeddings",
    "blocking",
    "clustering",
    "numpy",
    "faiss",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]
dependencies = [
    # Native comparison semantics implement the standard comparison families
    # (jaro-winkler, levenshtein, date-difference, ...); the only hard
    # dependencies are NumPy for vectorized scoring and FAISS for vector ANN.
    "numpy>=1.24",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.23",
]
test = [
    "pytest>=8.0",
]
dev = [
    "build>=1.2",
    "twine>=5.0",
]
benchmark = [
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/denisrobert/VectorER"
Repository = "https://github.com/denisrobert/VectorER"
Issues = "https://github.com/denisrobert/VectorER/issues"
Documentation = "https://github.com/denisrobert/VectorER/blob/master/README.md"

[tool.setuptools.dynamic]
version = { attr = "vectorer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["vectorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]